<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="NIRDIST.gif">
    <title>Nirdist | Pro Social</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --border: #262626;
            --text: #ffffff;
            --text-dim: #8e8e8e;
            --accent: #0095f6;
            --nav-width: 245px;
            --nav-collapsed: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--nav-width);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid var(--border);
            padding: 25px 12px;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            z-index: 1000;
        }

        .logo-area { font-size: 1.5rem; font-weight: 800; padding: 0 12px 30px; cursor: pointer; }

        .nav-item {
            display: flex; align-items: center; gap: 16px;
            padding: 12px; margin: 4px 0; border-radius: 8px;
            cursor: pointer; transition: 0.2s; color: white;
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { font-weight: bold; }

        @media (max-width: 1260px) {
            .sidebar { width: var(--nav-collapsed); }
            .nav-item span, .logo-area span { display: none; }
        }

        @media (max-width: 768px) { .sidebar { display: none; } }

        /* --- MAIN FEED --- */
        main {
            margin-left: var(--nav-width);
            flex: 1; display: flex; justify-content: center; padding: 20px;
        }
        @media (max-width: 1260px) { main { margin-left: var(--nav-collapsed); } }
        @media (max-width: 768px) { main { margin-left: 0; padding-bottom: 70px; } }

        .content-limit { width: 100%; max-width: 470px; }

        .stories-container { display: flex; gap: 15px; padding: 10px 0; overflow-x: auto; margin-bottom: 24px; scrollbar-width: none; }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-node { cursor: pointer; text-align: center; min-width: 75px; }
        .ring {
            width: 66px; height: 66px; border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #cc2366);
            display: flex; align-items: center; justify-content: center; margin-bottom: 5px;
        }
        .ring img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid black; object-fit: cover; }

        /* --- POSTS --- */
        .post { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .post-img { width: 100%; border-radius: 4px; cursor: pointer; }
        .post-actions { padding: 12px 0; font-size: 1.5rem; display:flex; gap:15px; }
        .action-icon { cursor: pointer; }
        .liked { color: #ed4956; }

        /* --- STORY OVERLAY --- */
        #storyOverlay {
            display: none; position: fixed;
            top:0; left:0; width: 100vw; height:100vh;
            background: #000; z-index: 2000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .story-timer-bar { position: absolute; top: 15px; left: 10px; right: 10px; height: 2px; display: flex; gap: 4px; z-index: 2010;}
        .t-segment { flex: 1; height: 100%; background: #333; border-radius: 2px; overflow: hidden; }
        .t-progress { height: 100%; width: 0%; background: white; }

        .story-nav-btn { position: absolute; width: 50%; height: 100%; z-index: 2001; cursor: pointer; top: 0; }
        .nav-prev { left: 0; }
        .nav-next { right: 0; }

        .story-img-full { max-height: 80vh; max-width: 100vw; border-radius: 8px; position: relative; z-index: 2000; }

        /* Mobile Nav */
        .mobile-nav {
            display: none; position: fixed; bottom: 0; width: 100%; height: 55px;
            background: black; border-top: 1px solid var(--border);
            justify-content: space-around; align-items: center; font-size: 1.5rem; z-index: 1000;
        }
        @media (max-width: 768px) { .mobile-nav { display: flex; } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area" onclick="window.location.reload()"><span>NIRDIST</span></div>
        <div class="nav-item active" onclick="handleNav(this, 'Home')"><i>🏠</i><span>Home</span></div>
        <div class="nav-item" onclick="handleNav(this, 'Search')"><i>🔍</i><span>Search</span></div>
        <div class="nav-item" onclick="handleNav(this, 'Explore')"><i>🧭</i><span>Explore</span></div>
        <div class="nav-item" onclick="handleNav(this, 'Messages')"><i>📩</i><span>Messages</span></div>
        <div class="nav-item" onclick="handleNav(this, 'Profile')"><i>👤</i><span>Profile</span></div>
        <div style="margin-top: auto;" class="nav-item" onclick="handleNav(this, 'Settings')"><i>⚙️</i><span>Settings</span></div>
    </nav>

    <main>
        <div class="content-limit">
            <div class="stories-container" id="storyList"></div>
            <div id="feedList"></div>
        </div>
    </main>

    <div class="mobile-nav">
        <span onclick="handleNav(this, 'Home')">🏠</span>
        <span onclick="handleNav(this, 'Search')">🔍</span>
        <span onclick="alert('Open Camera')">➕</span>
        <span onclick="handleNav(this, 'Profile')">👤</span>
    </div>

    <div id="storyOverlay">
        <div class="story-timer-bar" id="timerBar"></div>
        <div class="story-nav-btn nav-prev" onclick="prevStory()"></div>
        <div class="story-nav-btn nav-next" onclick="nextStory()"></div>

        <div style="position:absolute; top:35px; left:20px; display:flex; align-items:center; gap:10px; z-index:2020;">
            <img src="" id="storyAvatar" style="width:32px; height:32px; border-radius:50%; border: 1px solid #444;">
            <b id="storyUser"></b>
        </div>
        
        <span style="position:absolute; top:30px; right:20px; cursor:pointer; font-size:2.5rem; z-index:2030; color: white;" onclick="closeStory()">&times;</span>
        <img src="" id="activeStoryImg" class="story-img-full">
    </div>

    <script>
        const appData = {
            users: [
                { name: 'nirdist_poudel', img: 'NIRDIST.gif', story: 'NIRDIST.png' },
                { name: 'arbind_dev', img: 'ar.png', story: 'ar.png' },
                { name: 'rajmani', img: 'go2.gif', story: 'go3.gif' },
                { name: 'nirdist_bot', img: 'so.gif', story: 'so.gif' }
            ],
            posts: [
                { id: 101, user: 'nirdist_poudel', avatar: 'NIRDIST.gif', img: 'NIRDIST.png', caption: 'BIT 7th Sem Project in progress.', likes: 2401 },
                { id: 102, user: 'arbind_dev', avatar: 'ar.png', img: 'ar.png', caption: 'Networking lab was intense today.', likes: 1100 },
                { id: 103, user: 'nirdist_poudel', avatar: 'NIRDIST.gif', img: 'so.gif', caption: 'Ubuntu 24.04 looking sharp.', likes: 850 }
            ]
        };

        // --- RENDER FEED ---
        const feed = document.getElementById('feedList');
        feed.innerHTML = appData.posts.map(p => `
            <div class="post">
                <div class="post-header">
                    <img src="${p.avatar}" class="post-avatar">
                    <b>${p.user}</b>
                </div>
                <img src="${p.img}" class="post-img" ondblclick="likePost(${p.id})">
                <div class="post-actions">
                    <span class="action-icon" id="heart-${p.id}" onclick="likePost(${p.id})">🤍</span>
                    <span onclick="alert('Comments coming soon')">💬</span>
                </div>
                <div style="font-size: 0.9rem;">
                    <b id="count-${p.id}">${p.likes.toLocaleString()} likes</b><br>
                    <b>${p.user}</b> ${p.caption}
                </div>
            </div>
        `).join('');

        // --- RENDER STORIES ---
        const stories = document.getElementById('storyList');
        stories.innerHTML = appData.users.map((u, i) => `
            <div class="story-node" onclick="openStoryFlow(${i})">
                <div class="ring"><img src="${u.img}"></div>
                <p style="font-size:0.7rem; color:var(--text-dim)">${u.name}</p>
            </div>
        `).join('');

        // --- STORY ENGINE ---
        let currentIdx = 0;
        let storyInt;
        let progress = 0;

        function openStoryFlow(index) {
            currentIdx = index;
            progress = 0;
            document.getElementById('storyOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            buildTimerBars();
            loadStory();
        }

        function buildTimerBars() {
            const bar = document.getElementById('timerBar');
            bar.innerHTML = appData.users.map((_, i) => `
                <div class="t-segment">
                    <div class="t-progress" id="p-${i}" style="width: ${i < currentIdx ? '100%' : '0%'}"></div>
                </div>
            `).join('');
        }

        function loadStory() {
            const user = appData.users[currentIdx];
            document.getElementById('activeStoryImg').src = user.story;
            document.getElementById('storyAvatar').src = user.img;
            document.getElementById('storyUser').innerText = user.name;
            startTimer();
        }

        function startTimer() {
            clearInterval(storyInt);
            progress = 0;
            storyInt = setInterval(() => {
                progress += 1;
                document.getElementById(`p-${currentIdx}`).style.width = progress + '%';
                if (progress >= 100) nextStory();
            }, 50); 
        }

        function nextStory() {
            if (currentIdx < appData.users.length - 1) {
                document.getElementById(`p-${currentIdx}`).style.width = '100%';
                currentIdx++;
                loadStory();
            } else {
                closeStory();
            }
        }

        function prevStory() {
            if (currentIdx > 0) {
                document.getElementById(`p-${currentIdx}`).style.width = '0%';
                currentIdx--;
                loadStory();
            }
        }

        function closeStory() {
            document.getElementById('storyOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            clearInterval(storyInt);
        }

        // --- INTERACTION UTILS ---
        function handleNav(el, name) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            console.log("Navigated to: " + name);
            // In a real app, you would swap screens here
        }

        function likePost(id) {
            const h = document.getElementById(`heart-${id}`);
            const c = document.getElementById(`count-${id}`);
            let val = parseInt(c.innerText.replace(/,/g, ''));
            
            if (!h.classList.contains('liked')) {
                h.innerHTML = '❤️';
                h.classList.add('liked');
                c.innerText = (val + 1).toLocaleString() + " likes";
            } else {
                h.innerHTML = '🤍';
                h.classList.remove('liked');
                c.innerText = (val - 1).toLocaleString() + " likes";
            }
        }
    </script>
</body>
</html>
