<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="NIRDIST.gif">
    <title>Nirdist | Pro Social</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --border: #262626;
            --text: #ffffff;
            --text-dim: #8e8e8e;
            --accent: #0095f6;
            --nav-width: 245px;
            --nav-collapsed: 75px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* --- ADVANCED SIDEBAR (PC) --- */
        .sidebar {
            width: var(--nav-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--border);
            padding: 25px 12px;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            background: var(--bg);
            z-index: 1000;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 0 12px 30px;
            letter-spacing: -1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 1rem;
            text-decoration: none;
            color: white;
        }

        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item:active { transform: scale(0.96); }
        .nav-item i { font-size: 1.4rem; width: 24px; text-align: center; }

        /* Responsive Sidebar */
        @media (max-width: 1260px) {
            .sidebar { width: var(--nav-collapsed); }
            .nav-item span, .logo-area span { display: none; }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            main { margin-left: 0 !important; }
        }

        /* --- MAIN CONTENT AREA --- */
        main {
            margin-left: var(--nav-width);
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        
        @media (max-width: 1260px) { main { margin-left: var(--nav-collapsed); } }

        .content-limit { width: 100%; max-width: 470px; }

        /* --- STORY VIEWING SYSTEM --- */
        .stories-container {
            display: flex;
            gap: 15px;
            padding: 10px 0;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-node {
            cursor: pointer;
            text-align: center;
            min-width: 75px;
        }
        .ring {
            width: 66px; height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 5px;
        }
        .ring img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid black; object-fit: cover; }

        /* Full Screen Story Overlay */
        #storyOverlay {
            display: none;
            position: fixed;
            top:0; left:0; width: 100vw; height:100vh;
            background: #1a1a1a;
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .story-timer-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            height: 2px; background: #555; border-radius: 2px;
        }
        .story-progress {
            height: 100%; width: 0%; background: white; border-radius: 2px;
        }
        .story-img-full { max-height: 85vh; max-width: 95vw; border-radius: 12px; }

        /* --- POST STYLING --- */
        .post { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .post-img { width: 100%; border-radius: 4px; cursor: pointer; }
        .post-header { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
        .post-avatar { width: 32px; height: 32px; border-radius: 50%; }
        
        /* Mobile Bottom Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0; width: 100%; height: 50px;
            background: black; border-top: 1px solid var(--border);
            justify-content: space-around; align-items: center; font-size: 1.5rem;
        }
        @media (max-width: 768px) { .mobile-nav { display: flex; } }

    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area"><span>NIRDIST</span></div>
        <div class="nav-item"><i>🏠</i><span>Home</span></div>
        <div class="nav-item"><i>🔍</i><span>Search</span></div>
        <div class="nav-item"><i>🧭</i><span>Explore</span></div>
        <div class="nav-item"><i>📩</i><span>Messages</span></div>
        <div class="nav-item"><i>👤</i><span>Profile</span></div>
        <div style="margin-top: auto;" class="nav-item"><i>⚙️</i><span>Settings</span></div>
    </nav>

    <main>
        <div class="content-limit">
            
            <div class="stories-container" id="storyList">
                </div>

            <div id="feedList">
                </div>

        </div>
    </main>

    <div class="mobile-nav">
        <span>🏠</span><span>🔍</span><span>➕</span><span>👤</span>
    </div>

    <div id="storyOverlay">
        <div class="story-timer-bar"><div class="story-progress" id="pBar"></div></div>
        <span style="position:absolute; top:20px; right:20px; cursor:pointer; font-size:2rem;" onclick="closeStory()">×</span>
        <img src="" id="activeStoryImg" class="story-img-full">
        <p id="storyUser" style="position:absolute; top:25px; left:20px; font-weight:bold;"></p>
    </div>

    <script>
        const appData = {
            users: [
                { name: 'nirdist_poudel', img: 'NIRDIST.gif' },
                { name: 'arbind_dev', img: 'ar.png' },
                { name: 'rajmani', img: 'go2.gif' }
            ],
            posts: [
                { user: 'nirdist_poudel', img: 'NIRDIST.png', caption: 'System overhaul complete.', likes: '2,401' },
                { user: 'arbind_dev', img: 'ar.png', caption: 'BIT Project vibes.', likes: '1,100' },
                { user: 'nirdist_poudel', img: 'so.gif', caption: 'Testing visuals.', likes: '850' }
            ]
        };

        // Render Feed
        const feedContainer = document.getElementById('feedList');
        feedContainer.innerHTML = appData.posts.map(p => `
            <div class="post">
                <div class="post-header">
                    <img src="NIRDIST.gif" class="post-avatar">
                    <b>${p.user}</b>
                </div>
                <img src="${p.img}" class="post-img" ondblclick="alert('Liked!')">
                <div style="padding: 10px 0; font-size: 1.4rem; display:flex; gap:15px;">
                    <span>🤍</span><span>💬</span><span>✈️</span>
                </div>
                <div style="font-size: 0.9rem;">
                    <b>${p.likes} likes</b><br>
                    <b>${p.user}</b> ${p.caption}
                </div>
            </div>
        `).join('');

        // Render Stories
        const storyContainer = document.getElementById('storyList');
        storyContainer.innerHTML = appData.users.map(u => `
            <div class="story-node" onclick="viewStory('${u.img}', '${u.name}')">
                <div class="ring"><img src="${u.img}"></div>
                <p style="font-size:0.7rem; color:var(--text-dim)">${u.name}</p>
            </div>
        `).join('');

        // Story Logic
        let storyTimer;
        function viewStory(img, name) {
            const overlay = document.getElementById('storyOverlay');
            const activeImg = document.getElementById('activeStoryImg');
            const pBar = document.getElementById('pBar');
            
            overlay.style.display = 'flex';
            activeImg.src = img;
            document.getElementById('storyUser').innerText = name;
            
            // Animation for Progress Bar
            pBar.style.width = '0%';
            let width = 0;
            clearInterval(storyTimer);
            storyTimer = setInterval(() => {
                if (width >= 100) {
                    closeStory();
                } else {
                    width++;
                    pBar.style.width = width + '%';
                }
            }, 30); // Story lasts 3 seconds
        }

        function closeStory() {
            document.getElementById('storyOverlay').style.display = 'none';
            clearInterval(storyTimer);
        }

    </script>
</body>
</html>
