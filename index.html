<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="NIRDIST.gif">
    <title>Nirdist | Experience</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --border: #262626;
            --text: #ffffff;
            --text-dim: #8e8e8e;
            --accent: #0095f6;
            --danger: #ed4956;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        /* --- Layout Structures --- */
        .app-container {
            display: flex;
            width: 100%;
            max-width: 935px;
            justify-content: center;
            gap: 30px;
        }

        /* Desktop Sidebar (Hidden on Mobile) */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 20px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .app-container { max-width: 100%; }
        }

        /* --- Feed Engine --- */
        main.feed-engine {
            width: 100%;
            max-width: 470px;
            padding: 20px 0 80px 0;
        }

        /* Stories System */
        .stories-tray {
            display: flex;
            gap: 12px;
            padding: 10px 5px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            margin-bottom: 20px;
        }
        .stories-tray::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .story-ring:active { transform: scale(0.9); }

        .story-ring img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid black;
            object-fit: cover;
        }

        .story-user {
            font-size: 0.75rem;
            color: var(--text-dim);
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Post Architecture */
        .post-node {
            width: 100%;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .username-link {
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .media-container {
            width: 100%;
            background: #050505;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .media-container img {
            width: 100%;
            max-height: 580px;
            object-fit: contain;
        }

        /* Post Interactions */
        .post-actions {
            padding: 12px 10px;
            display: flex;
            justify-content: space-between;
        }

        .action-group {
            display: flex;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(1.2); }
        .icon-btn.liked { color: var(--danger); }

        .post-meta {
            padding: 0 12px 15px 12px;
            font-size: 0.9rem;
        }

        .likes-count { font-weight: 700; margin-bottom: 5px; display: block; }
        .caption-text b { margin-right: 5px; }

        /* --- Full View Modal --- */
        #mediaModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
        }

        .modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
        }

        /* --- Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }

        /* --- Big Heart Animation --- */
        .big-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            color: white;
            pointer-events: none;
            z-index: 10;
        }

        .heart-animate {
            animation: heartPop 0.8s ease-out;
        }

        @keyframes heartPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <h2 style="font-size: 1.6rem; letter-spacing: -1px;">NIRDIST</h2>
            <div class="username-link">🏠 Home</div>
            <div class="username-link">🔍 Search</div>
            <div class="username-link">🧭 Explore</div>
            <div class="username-link">🎬 Reels</div>
            <div class="username-link">✉️ Messages</div>
            <div class="username-link">👤 Profile</div>
        </aside>

        <main class="feed-engine">
            
            <div class="stories-tray" id="storiesTray">
                </div>

            <div id="mainFeed">
                </div>

        </main>

    </div>

    <nav class="bottom-nav">
        <span class="icon-btn">🏠</span>
        <span class="icon-btn">🔍</span>
        <span class="icon-btn">➕</span>
        <span class="icon-btn">🎬</span>
        <span class="icon-btn" onclick="alert('Profile of Nirdist')">👤</span>
    </nav>

    <div id="mediaModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="">
        </div>
    </div>

    <script>
        // --- DATA ENGINE ---
        const postsData = [
            { id: 1, user: 'nirdist_poudel', avatar: 'NIRDIST.gif', media: 'NIRDIST.png', likes: 1204, caption: 'Core logic built. System live. 🚀', time: '2h' },
            { id: 2, user: 'nirdist_poudel', avatar: 'NIRDIST.gif', media: 'so.gif', likes: 890, caption: 'Visual dynamics in motion.', time: '5h' },
            { id: 3, user: 'poudel_vibe', avatar: 'go2.gif', media: 'go3.gif', likes: 450, caption: 'Abstract testing phase 03.', time: '8h' },
            { id: 4, user: 'arbind_dev', avatar: 'ar.png', media: 'NIRDIST.gif', likes: 2311, caption: 'This animation looks smooth! Good work.', time: '1d' }
        ];

        const storiesData = [
            { user: 'Your Story', img: 'NIRDIST.gif' },
            { user: 'arbind', img: 'ar.png' },
            { user: 'aishwarya', img: 'go2.gif' },
            { user: 'bit_lab', img: 'go3.gif' },
            { user: 'linux_fan', img: 'so.gif' },
            { user: 'nepal_dev', img: 'NIRDIST.png' }
        ];

        // --- RENDER ENGINES ---
        function initApp() {
            renderStories();
            renderFeed();
        }

        function renderStories() {
            const tray = document.getElementById('storiesTray');
            tray.innerHTML = storiesData.map(s => `
                <div class="story-item">
                    <div class="story-ring"><img src="${s.img}"></div>
                    <span class="story-user">${s.user}</span>
                </div>
            `).join('');
        }

        function renderFeed() {
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = postsData.map(post => `
                <article class="post-node" id="post-${post.id}">
                    <div class="post-header">
                        <div class="post-user-info">
                            <img src="${post.avatar}" class="avatar-sm">
                            <span class="username-link">${post.user}</span>
                        </div>
                        <span>•••</span>
                    </div>
                    
                    <div class="media-container" ondblclick="handleDoubleTap(${post.id})">
                        <img src="${post.media}" onclick="openModal('${post.media}')" loading="lazy">
                        <div class="big-heart" id="heart-${post.id}">❤️</div>
                    </div>

                    <div class="post-actions">
                        <div class="action-group">
                            <button class="icon-btn" onclick="toggleLike(this, ${post.id})">🤍</button>
                            <button class="icon-btn">💬</button>
                            <button class="icon-btn">✈️</button>
                        </div>
                        <button class="icon-btn">🔖</button>
                    </div>

                    <div class="post-meta">
                        <span class="likes-count" id="likes-${post.id}">${post.likes} likes</span>
                        <p class="caption-text"><b>${post.user}</b> ${post.caption}</p>
                        <p style="color:var(--text-dim); font-size:0.7rem; margin-top:5px;">${post.time} AGO</p>
                    </div>
                </article>
            `).join('');
        }

        // --- INTERACTIVE LOGIC ---

        // Like System
        function toggleLike(btn, id) {
            const likesEl = document.getElementById(`likes-${id}`);
            let currentLikes = parseInt(likesEl.innerText.replace(',', ''));
            
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                btn.innerText = '🤍';
                likesEl.innerText = `${(currentLikes - 1).toLocaleString()} likes`;
            } else {
                btn.classList.add('liked');
                btn.innerText = '❤️';
                likesEl.innerText = `${(currentLikes + 1).toLocaleString()} likes`;
            }
        }

        // Double Tap Animation
        function handleDoubleTap(id) {
            const heart = document.getElementById(`heart-${id}`);
            const post = document.querySelector(`#post-${id} .icon-btn`);
            
            heart.classList.add('heart-animate');
            setTimeout(() => heart.classList.remove('heart-animate'), 800);
            
            if (!post.classList.contains('liked')) {
                toggleLike(post, id);
            }
        }

        // Modal Controls
        function openModal(src) {
            const modal = document.getElementById('mediaModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Stop scroll
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Resume scroll
        }

        // Start the app
        initApp();
    </script>
</body>
</html>
