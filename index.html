<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="NIRDIST.gif">
    <title>Poudel | Nirdist</title>
    <style>
        /* Modern Reset & Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #0a0a0a; /* Deep black */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container for the images */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px; /* Keeps it from getting too wide on huge monitors */
        }

        /* Image Styling */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: #1a1a1a;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover effect to make it feel interactive */
        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures images fill the square without stretching */
            display: block;
            loading: lazy; /* Improves performance by loading as you scroll */
        }

        /* Title for aesthetics */
        h1 {
            color: white;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>Nirdist Poudel</h1>

    <div class="gallery-container">
        <div class="gallery-item"><img src="NIRDIST.png" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="NIRDIST.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="so.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="go3.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="go2.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="ar.png" alt="Nirdist Poudel"></div>
        
        <div class="gallery-item"><img src="NIRDIST.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="NIRDIST.png" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="NIRDIST.gif" alt="Nirdist Poudel"></div>
        <div class="gallery-item"><img src="NIRDIST.png" alt="Nirdist Poudel"></div>
    </div>

</body>
</html>
